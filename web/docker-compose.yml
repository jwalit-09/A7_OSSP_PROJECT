version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '5000:5000'
    volumes:
      - '/tmp/shellforge_workspace:/workspace'
    environment:
      - FLASK_ENV=production
      - WORKSPACE_DIR=/tmp/shellforge_workspace
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - '3000:80'
    volumes:
      - './frontend:/usr/share/nginx/html'
    depends_on:
      - backend
    restart: unless-stopped
